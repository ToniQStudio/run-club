<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      background: #030712;
      color: #f9fafb;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    img { display: block; width: 760px; height: auto; }
    .slogan {
      margin: 38px 0 0;
      color: #ccff00;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .meta {
      margin: 12px 0 0;
      color: #9ca3af;
      font-size: 26px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img src="logo-wordmark-dark.svg" alt="ЮБ800">
  <p class="slogan">Не один. Ты в команде</p>
  <p class="meta">21 ноября · Лужники · Москва</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR — открытая тренировка 21 ноября — ЮБ800</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* ds-allow-hardcode:start */
    /* standalone print sheet */
    @font-face {
      font-family: "Jost";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("assets/fonts/jost.woff2") format("woff2");
    }

    @page {
      size: A5;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      width: 148mm;
      min-height: 210mm;
      flex-direction: column;
      align-items: center;
      padding: 14mm 14mm 12mm;
      background: #ffffff;
      color: #030712;
      font-family: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .eyebrow {
      margin: 0 0 6mm;
      color: #6b7280;
      font-size: 9pt;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34pt;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.98;
    }

    .lead {
      max-width: 92mm;
      margin: 5mm auto 0;
      color: #374151;
      font-size: 12pt;
      line-height: 1.35;
    }

    .qr {
      margin: 9mm 0 5mm;
      padding: 3mm;
      border: 1px solid #e5e7eb;
      border-radius: 3mm;
    }

    .qr img {
      display: block;
      width: 92mm;
      height: 92mm;
    }

    .cta {
      margin: 0;
      color: #030712;
      font-size: 16pt;
      font-weight: 700;
      line-height: 1.15;
    }

    .url {
      margin: 3mm 0 0;
      color: #6b7280;
      font-size: 8.5pt;
      word-break: break-all;
    }

    .note {
      margin: auto 0 0;
      padding-top: 6mm;
      color: #6b7280;
      font-size: 9pt;
    }

    .accent {
      color: #030712;
      background: #ccff00;
      padding: 1mm 2mm;
      font-weight: 700;
    }

    @media screen {
      body {
        margin: 12mm auto;
        box-shadow: 0 0 24px rgba(17, 24, 39, 0.12);
      }
    }
    /* ds-allow-hardcode:end */
  </style>
</head>
<body>
  <p class="eyebrow">ЮБ800 · Сборная</p>
  <h1>21 ноября.<br>Москва</h1>
  <p class="lead">Открытая тренировка для всех: новичков, любителей и опытных. 3–5 км в своём темпе</p>

  <div class="qr">
    <!-- QR ведёт на https://run800.ru/join.html?source=qr_open_run -->
    <img src="assets/open-run-qr.svg" alt="QR-код для записи на открытую тренировку">
  </div>

  <p class="cta">Наведите камеру —<br>быстрая запись</p>
  <p class="url">run800.ru/join.html</p>
  <p class="note"><span class="accent">Бесплатно</span> · без обязательств · группа до 15 человек</p>
</body>
</html>

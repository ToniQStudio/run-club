<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Сборная ЮБ800</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--color-bg);
      color: var(--color-text);
    }
    .notfound-card { max-width: 520px; text-align: center; }
    .notfound-code {
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: -.05em;
      color: var(--color-accent);
      margin: 0 0 16px;
    }
    .notfound h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 12px; }
    .notfound p { color: var(--color-text-secondary); margin: 0 0 24px; line-height: 1.5; }
    .notfound-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-card">
      <p class="notfound-code">404</p>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там этапы, открытая тренировка и запись.</p>
      <div class="notfound-actions">
        <a class="button button-primary" href="/">На главную</a>
        <a class="button button-secondary" href="/#join">Записаться</a>
      </div>
    </div>
  </main>
  <script src="assets/cookies.js" defer></script>
</body>
</html>
